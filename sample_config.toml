[mods]
hyper = ["command", "option", "shift", "control"]

[binds]
"hyper+esc" = "sleep 0.25; pmset displaysleepnow"
"hyper+§" = "sleep 0.25; pmset sleepnow"
"hyper+m" = "menubar:toggle"
"cmd+c" = { action = "menubar:click", item = ["Edit", "Copy"] }
"fn+cmd+c" = { action = "menubar:show", item = ["Copy"] }
"cmd+t" = { action = "menubar:click", app = "Google Chrome", item = ["File", "New Tab"] }

[menubar]
enabled = false
max_len = 12

[layer.open]
activate = "hyper+o"
mode = "sticky"
deactivate = "esc"
d = "open ~/Downloads"
h = "open ~"

[layer.open.code]
activate = "c"
r = "open ~/code/rust"
p = "open ~/code/py"
w = "open ~/code/web"

[layer.launch]
activate = "hyper+l"
s = "open -a Safari"
f = "open -a Finder"
g = "open -a Ghostty"
x = "open -a Xcode"
c = "open -a Google Chrome"
v = "open -a Visual Studio Code"
t = "open -a Terminal"
m = "open -a Activity Monitor"

[layer.snap]
activate = "hyper+s"
mode = "sticky"
timeout = 1200
j = "snap:LeftHalf"
k = "snap:Maximize"
l = "snap:RightHalf"
"shift+j" = "snap:Left"
"shift+l" = "snap:Right"
r = "snap:Restore"
f = "snap:Fullscreen"

[layer.snap.quarters]
activate = "q"
i = "snap:TopLeftQuarter"
o = "snap:TopRightQuarter"
k = "snap:BottomLeftQuarter"
l = "snap:BottomRightQuarter"

[layer.kiwi]
activate = "hyper+i"
mode = "oneshot"
timeout = 0
r = "reload"

[app."Google Chrome"]
"hyper+w" = "remap:cmd+w"
